<svg xmlns="http://www.w3.org/2000/svg" width="914" height="250" viewBox="0 0 914 250" role="img" aria-labelledby="title desc">
<title id="title">VoiceFlow dictation workflow</title><desc id="desc">Press a hold or toggle shortcut, speak, choose local Whisper or Bark or Gemini cloud, and insert a complete transcript or recognized phrases into the focused text field.</desc>
<rect x="1" y="1" width="912" height="248" rx="22" fill="#11161e" stroke="#303947"/>
<text x="32" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="650" fill="#f2f5fa">One shortcut. Two ways to transcribe.</text><rect x="32" y="75" width="210" height="85" rx="14" fill="#1c2430" stroke="#354153"/><text x="50" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#f2f5fa">SPEAK</text><text x="50" y="136" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">Hold or toggle</text><rect x="304" y="75" width="250" height="85" rx="14" fill="#1c2430" stroke="#354153"/><text x="322" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#f2f5fa">LOCAL OR CLOUD</text><text x="322" y="136" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">Whisper / Bark / Gemini</text><rect x="610" y="75" width="270" height="85" rx="14" fill="#1c2430" stroke="#354153"/><text x="628" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650" fill="#f2f5fa">YOUR TEXT FIELD</text><text x="628" y="136" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">Finished or phrase-by-phrase</text><path d="M251 116h42m-9-6 9 6-9 6 M563 116h36m-9-6 9 6-9 6" stroke="#8c9bb1" stroke-width="2" fill="none"/><text x="32" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#a9b3c3">Local mode keeps recognition on your PC. Cloud mode sends audio to Gemini.</text>
</svg>
