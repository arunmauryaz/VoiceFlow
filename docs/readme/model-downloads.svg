<svg xmlns="http://www.w3.org/2000/svg" width="914" height="510" viewBox="0 0 914 510" role="img" aria-labelledby="title desc">
<title id="title">VoiceFlow model download sizes</title><desc id="desc">Whisper Tiny approximately 78 MB, Base 148 MB, Small Q5 190 MB, and Underdog Bark Clean 180 MB. Gemini needs no local model weights. Download size is not memory usage or total installed size; Bark has a separate runtime and decoded cache.</desc>
<rect x="1" y="1" width="912" height="508" rx="22" fill="#11161e" stroke="#303947"/>
<text x="32" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f5fa">Small downloads. Different workloads.</text><text x="32" y="74" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#a9b3c3">Four local options, downloaded when you select them.</text><text x="32" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#edf1f7">Whisper Tiny</text><rect x="249" y="105" width="400" height="18" rx="7" fill="#283241"/><rect x="249" y="105" width="156.0" height="18" rx="7" fill="#aebed3"/><text x="670" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#edf1f7">~78 MB</text><text x="249" y="147" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">Multilingual · lightest local choice</text><text x="32" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#edf1f7">Whisper Base</text><rect x="249" y="177" width="400" height="18" rx="7" fill="#283241"/><rect x="249" y="177" width="296.0" height="18" rx="7" fill="#aebed3"/><text x="670" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#edf1f7">~148 MB</text><text x="249" y="219" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">Multilingual · everyday starting point</text><text x="32" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#edf1f7">Whisper Small Q5</text><rect x="249" y="249" width="400" height="18" rx="7" fill="#283241"/><rect x="249" y="249" width="380.0" height="18" rx="7" fill="#aebed3"/><text x="670" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#edf1f7">~190 MB</text><text x="249" y="291" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">Multilingual · more local compute</text><text x="32" y="338" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#edf1f7">Bark 3.0 Clean</text><rect x="249" y="321" width="400" height="18" rx="7" fill="#283241"/><rect x="249" y="321" width="360.0" height="18" rx="7" fill="#aebed3"/><text x="670" y="338" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#edf1f7">~180 MB</text><text x="249" y="363" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">English · built-in filler cleanup</text><text x="32" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#edf1f7">Gemini cloud: no local weights • Requires internet and your API key</text><text x="32" y="458" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">Bars compare download size, not RAM, total disk usage, speed, or accuracy.</text><text x="32" y="483" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">Bark adds a Python runtime and an optional ~2.5 GB decoded cache.</text>
</svg>
