<svg xmlns="http://www.w3.org/2000/svg" width="914" height="385" viewBox="0 0 914 385" role="img" aria-labelledby="title desc">
<title id="title">Which PC can use VoiceFlow?</title><desc id="desc">Starting recommendations: limited-memory 4 GB class PCs should try Gemini cloud, 8 GB class PCs should start with Whisper Tiny or Base, and 16 GB or more provides headroom for Small Q5 or English-only Bark. These are not tested minimums. Local Whisper requires Windows 11 and supported CPU instructions.</desc>
<rect x="1" y="1" width="912" height="383" rx="22" fill="#11161e" stroke="#303947"/>
<text x="32" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f5fa">A starting point for your PC</text><text x="32" y="74" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#a9b3c3">No dedicated GPU required. Choose based on memory headroom and language.</text><rect x="32" y="103" width="270" height="190" rx="15" fill="#1c2430" stroke="#354153"/><text x="50" y="134" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#9caec9">TIGHT ON RAM</text><text x="50" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="650" fill="#fff">4 GB class</text><text x="50" y="216" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#d1d7e2">Gemini cloud</text><text x="50" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">No local model load</text><text x="50" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9b3c3">Internet + your API key</text><rect x="322" y="103" width="270" height="190" rx="15" fill="#1c2430" stroke="#354153"/><text x="340" y="134" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#9caec9">EVERYDAY LAPTOP</text><text x="340" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="650" fill="#fff">8 GB class</text><text x="340" y="216" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#d1d7e2">Whisper Tiny / Base</text><text x="340" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">Start with CPU</text><text x="340" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9b3c3">Multilingual, including Hindi</text><rect x="612" y="103" width="270" height="190" rx="15" fill="#1c2430" stroke="#354153"/><text x="630" y="134" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="650" fill="#9caec9">MORE HEADROOM</text><text x="630" y="177" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="650" fill="#fff">16 GB+ class</text><text x="630" y="216" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" fill="#d1d7e2">Small Q5 / Bark</text><text x="630" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">Bark: English only</text><text x="630" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a9b3c3">Several GB free RAM for Bark</text><text x="32" y="333" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">RAM bands are recommendations, not validated minimums or speed benchmarks.</text><text x="32" y="358" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b3c3">Local Whisper also needs Windows 11 + AVX2 / FMA / F16C. Full requirements below.</text>
</svg>
